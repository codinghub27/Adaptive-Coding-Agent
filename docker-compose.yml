services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coding_agent
      POSTGRES_PASSWORD: coding_agent
      POSTGRES_DB: coding_agent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coding_agent -d coding_agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # The qdrant image has no curl/wget, so a HTTP-based healthcheck isn't
    # available out of the box. This checks that the REST port is accepting
    # TCP connections via bash's /dev/tcp pseudo-device.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
