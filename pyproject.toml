[project]
name = "adaptive-coding-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The journey dataset's own generators: their long lines ARE the dataset text
# (learner and tutor turns), which is never edited to satisfy a linter
# (docs/features/ADAPTIVE-journey-eval.md). Only these rules, only these files.
"eval/behavior/journey/build_dataset.py" = ["E501", "SIM115", "B905"]
"eval/behavior/journey/heldout/build_dataset.py" = ["E501", "SIM115", "B905"]
"eval/behavior/journey/render_md.py" = ["E501", "SIM115", "B905"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["app", "tests"]
exclude = ["venv", "alembic"]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs docker compose infra (Postgres + Qdrant)",
    "live: calls the real LLM provider; opt-in via RUN_LIVE_LLM=1",
    "db: needs a reachable, migrated Postgres (no Qdrant needed)",
    "sandbox: needs a running Docker engine and the aca-sandbox image",
]
