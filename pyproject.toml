[project]
name = "adaptive-coding-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["app", "tests"]
exclude = ["venv", "alembic"]
venvPath = "."
venv = "venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs docker compose infra (Postgres + Qdrant)",
]
