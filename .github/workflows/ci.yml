# ADAPTIVE-upgrade P7: the scorecard as failing CI gates.
#
# `static` runs on every push / PR: lint, format, strict types, the unit suite,
# and the LLM-free adaptation-speed measurement.
#
# `live-eval` drives the REAL graph (real LLM, Qdrant, Docker sandbox) and the
# REAL HTTP API through the fixed instrument, and fails on any Section 10 gate.
# It costs LLM quota (Groq free tier: ~2 turns/min/key), so it runs nightly and
# on demand, not per push. Needs repository secrets GROQ_API_KEY (+ optional
# GROQ_API_KEY_1..4, OPENROUTER_API_KEY) and, for the trace gate,
# LANGSMITH_API_KEY.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  static:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aca
          POSTGRES_PASSWORD: aca
          POSTGRES_DB: aca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aca" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://aca:aca@localhost:5432/aca
      QDRANT_URL: http://localhost:6333
      LLM_PROVIDER: groq
      GROQ_API_KEY: ci-placeholder
      JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-0123456789
      KNOWLEDGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # The unit suite's autouse `_isolate_settings_env` fixture strips the
      # infra env vars (DATABASE_URL, QDRANT_URL, provider keys, ...) from the
      # process so unit tests can't be swayed by the shell. `db`/`integration`
      # tests get them back from a `.env` file, which `monkeypatch.delenv`
      # never touches -- the documented mechanism (see tests/conftest.py).
      # Locally that file exists; CI has none, so those tests failed to build
      # `Settings` once the env was stripped. Materialize it from the job env
      # (the single source of truth) so CI mirrors local dev. `.env` is
      # gitignored, so this is created, never committed.
      - name: materialize .env for env-isolated db/integration tests
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "QDRANT_URL=$QDRANT_URL"
            echo "LLM_PROVIDER=$LLM_PROVIDER"
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "JWT_SECRET_KEY=$JWT_SECRET_KEY"
            echo "KNOWLEDGE_ENABLED=$KNOWLEDGE_ENABLED"
          } > .env
      - run: alembic upgrade head && alembic check
      - run: ruff check .
      - run: ruff format --check app tests eval
      - run: pyright app tests
      - name: unit + db tests (no live LLM, no sandbox, no Qdrant)
        run: pytest tests -q -m "not live and not sandbox and not integration"
      - name: adaptation speed (family aggregation must beat per-pattern keys)
        run: python -m eval.adaptation_speed

  # live-eval needs a real LLM key (Groq or OpenRouter) to build the index and
  # drive the graph. The `secrets` context isn't available in a job-level `if`,
  # so this probe reads it in a step env and publishes whether one is set. When
  # none is configured, live-eval is skipped (not failed), so the nightly run
  # stays green until the repository owner adds the secrets.
  check-secrets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_llm_key: ${{ steps.probe.outputs.has_llm_key }}
    steps:
      - id: probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ] || [ -n "$OPENROUTER_API_KEY" ]; then
            echo "has_llm_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_llm_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::live-eval skipped: set a GROQ_API_KEY or OPENROUTER_API_KEY repository secret to enable it."
          fi

  live-eval:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_llm_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aca
          POSTGRES_PASSWORD: aca
          POSTGRES_DB: aca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aca" --health-interval 5s --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://aca:aca@localhost:5432/aca
      QDRANT_URL: http://localhost:6333
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: adaptive-coding-agent-ci
      JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sandbox image
        run: docker build -t aca-sandbox:py3.11-v1 -f docker/sandbox.Dockerfile docker
      - run: alembic upgrade head
      - run: python -m scripts.build_index
      - name: eval harness gates (routing/topic >=95, hint_safety/debug_fix 100, groundedness >=80)
        run: python -m eval.run --gate
      - name: evidence-path determinism
        run: python -m eval.determinism --runs 10
      - name: transcript probes over the live API (hard gates + >=95% scorecard)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 3; done
          python -m eval.transcript_probes --langsmith --gate --out eval/results/ci.json
      # ADAPTIVE-tutoring Q7: the tutoring instrument as failing gates.
      - name: tutoring replay (5 reference conversations; >=90% checks + hard gates)
        run: python -m eval.behavior.replay --pace 10 --gate 0.90 --out eval/results/ci-tutoring.json
      - name: pending state (replies graded 100%, new requests clear 100%)
        run: python -m eval.behavior.pending_probe --replay eval/results/ci-tutoring.json
      - name: grader >=90%, 0 injections correct, misconception detection >=85%, closed ids
        run: python -m eval.behavior.offline --gate --out eval/results/ci-offline.json
      - name: no learner text in LangSmith traces (grade_answer included)
        run: python -m eval.behavior.trace_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transcript-probes
          path: |
            eval/results/ci.json
            eval/results/ci-tutoring.json
            eval/results/ci-offline.json
